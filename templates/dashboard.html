<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Dashboard</h1>

    <div>
        <form method="post" action="/accounts/logout/">
            {% csrf_token %}
            User: {{ username }} <input type="submit" value="Logout" />
        </form>
    </div>

    <h2>Tasks</h2>

    {% for task in tasks %}
        <p>{{ task.content }}</p>
    {% endfor %}
</body>
</html>
